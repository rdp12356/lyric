name: Music library and player QA

on:
  push:
    branches:
      - feat/persistent-music-library-queue
  pull_request:
    branches:
      - feat/web-spotify-pkce-lyrics
  workflow_dispatch:

permissions:
  contents: read

jobs:
  library-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: TypeScript check and production build
        run: npm run build
      - name: Pure data and Spotify regression tests
        run: |
          node tests/music-library.cjs
          node tests/web-spotify-auth.cjs
          node tests/web-spotify-playback.cjs
          node tests/lrclib-refresh.cjs
          node tests/lrclib-version-matching.cjs
          node tests/sync-audio.cjs
          node tests/desktop-bridge-security.cjs
      - name: Install Chromium for realistic browser QA
        run: npx playwright install --with-deps chromium
      - name: Music library and Spotify browser UI smoke
        timeout-minutes: 4
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/lyric-library-vite.log 2>&1 &
          for attempt in $(seq 1 25); do
            curl -sf http://127.0.0.1:5173/ >/dev/null && break
            sleep 1
          done
          timeout 90s node tests/music-library-ui.cjs
          timeout 90s node tests/web-spotify-ui.cjs
          timeout 90s node tests/web-spotify-stale-lyrics.cjs
